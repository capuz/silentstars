name: Manual post

on:
  workflow_dispatch:
    inputs:
      project_repo:
        description: "Repo a destacar — owner/repo (ej: opn-build/openalive). Vacío = pick diario"
        type: string
        default: ''
      post_to_bluesky:
        description: "🦋 Publicar en Bluesky"
        type: boolean
        default: true
      dry_run:
        description: "Dry run — previsualizar sin publicar"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    name: Post manual
    runs-on: ubuntu-latest
    environment: BSKY_IDENTIFIER
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute project slug
        id: slug
        if: inputs.project_repo != ''
        env:
          REPO: ${{ inputs.project_repo }}
        run: |
          SLUG=$(echo "$REPO" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|; s|[^a-z0-9-]|-|g')
          echo "value=$SLUG" >> $GITHUB_OUTPUT

      - name: Post to Bluesky
        if: inputs.post_to_bluesky == true
        id: post_bluesky
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/post.ts 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          exit $EXIT_CODE
        env:
          BSKY_IDENTIFIER:   ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BASE_URL:          https://capuz.github.io/silentstars
          DRY_RUN:           ${{ inputs.dry_run }}
          PROJECT_SLUG:      ${{ steps.slug.outputs.value }}

      - name: Commit posted.json
        if: inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "chore: record manual post [skip ci]"
          git pull --rebase origin main
          git push

      - name: Summary
        run: |
          echo "### Manual post summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repo**: ${{ inputs.project_repo || '(daily pick)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bluesky**: ${{ inputs.post_to_bluesky }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run**: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
