name: Retry nightly on runner starvation

# GitHub occasionally never assigns a hosted runner to a scheduled job
# ("The job was not acquired by Runner of type hosted even after multiple
# attempts", e.g. run 28999134437): the run is marked failure without a
# single step executing, and that night's collect + post silently never
# happens. This watchdog re-runs those — and only those — failures.

on:
  workflow_run:
    workflows: ["Nightly collect + deploy"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Rerun if no runner was acquired
    runs-on: ubuntu-latest
    # run_attempt < 3 caps automatic retries at two, breaking any rerun loop.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    steps:
      - name: Detect starvation and rerun
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # Starvation signature (verified against real runs): the starved job
          # ends "cancelled" with 0 steps and everything downstream is skipped,
          # so no failed/cancelled job has any executed step. A code failure
          # (e.g. an X API 403) always leaves a failed job WITH steps — those
          # must stay red for a human, not be retried blindly.
          INFRA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")] | length > 0 and all(.steps | length == 0)')
          if [ "$INFRA" != "true" ]; then
            echo "Run $RUN_ID attempt $ATTEMPT failed inside executed steps — real failure, leaving it red."
            exit 0
          fi
          echo "Runner starvation detected on run $RUN_ID attempt $ATTEMPT — rerunning failed jobs."
          if ! gh run rerun "$RUN_ID" --failed; then
            # Some starved runs expose no rerunnable "failed" jobs (the starved
            # job is 'cancelled'). Falling back to a full rerun is safe only if
            # nothing ran at all — otherwise a full rerun could repeat a post.
            RAN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select((.steps | length) > 0)] | length')
            if [ "$RAN" = "0" ]; then
              echo "No failed-job rerun available — nothing executed, doing a full rerun."
              gh run rerun "$RUN_ID"
            else
              echo "Cannot rerun safely (some jobs already executed steps). Leaving run $RUN_ID red."
              exit 1
            fi
          fi
