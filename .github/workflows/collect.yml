name: Nightly collect + deploy

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every night
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip_collect:
        type: boolean
        default: false
      skip_post:
        type: boolean
        default: false
      skip_post_x:
        type: boolean
        default: false
      submission_repo:
        type: string
        default: ''
      submission_project_name:
        type: string
        default: ''
    outputs:
      bsky_url:
        description: "Bluesky post URL"
        value: ${{ jobs.post.outputs.bsky_url }}
      bsky_post_text_b64:
        description: "Base64-encoded Bluesky post text"
        value: ${{ jobs.post.outputs.bsky_post_text_b64 }}
      x_post_url:
        description: "X.com post URL"
        value: ${{ jobs.post-x.outputs.x_post_url }}
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Saltar collect (no actualiza datos de GitHub)"
        type: boolean
        default: false
      skip_post:
        description: "Saltar post a Bluesky"
        type: boolean
        default: false
      skip_post_x:
        description: "Saltar post a X.com"
        type: boolean
        default: false
      dry_run:
        description: "Dry run — log post without sending to Bluesky or X.com"
        type: boolean
        default: true
      # Submission flow — set by process-submission.yml when a new project is accepted
      submission_repo:
        description: "owner/repo that triggered this run (submission flow)"
        type: string
        default: ''
      submission_issue:
        description: "Issue number of the original submission"
        type: string
        default: ''
      submission_email:
        description: "Submitter email to notify after deploy+post"
        type: string
        default: ''
      submission_project_name:
        description: "Project display name for the notification email"
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: query GitHub API, update data/ and content/projects/
  # Only runs on schedule or manual trigger (not on push)
  # ─────────────────────────────────────────────────────────────
  collect:
    name: Collect data
    runs-on: ubuntu-latest
    # Boolean inputs must be compared as booleans: `!= 'true'` never matches a
    # typed boolean input (GHA coerces true→1 vs 'true'→NaN), silently disabling
    # the skip flags on manual dispatches.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.skip_collect != true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Discover new candidates
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect and update data
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/discovered.json src/content/projects/ data/posted.json
          git diff --cached --quiet || git commit -m "chore: nightly data collect [skip ci]"
          git push

  # ─────────────────────────────────────────────────────────────
  # Job 2: Astro build + deploy to GitHub Pages
  # Runs after collect (when scheduled) OR directly on push to main
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: [collect]
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      post_slug: ${{ steps.picks.outputs.post_slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main   # always build the latest commit (after collect may have pushed)

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # Single source of truth for today's pick: post/post-x consume post_slug
      # instead of re-running the selection and hoping it agrees. Runs before the
      # build so the home page can feature today's pick (FEATURED_SLUG).
      - name: Select today's picks
        id: picks
        run: |
          # Today's picks — may be different per platform if posting histories diverge
          if [ -n "${{ inputs.submission_repo }}" ]; then
            KNOWN=$(echo "${{ inputs.submission_repo }}" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|; s|[^a-z0-9-]|-|g')
            BSKY_SLUG="$KNOWN"
            X_SLUG="$KNOWN"
          else
            BSKY_SLUG=$(npx tsx scripts/select-post.ts bsky 2>/dev/null || true)
            X_SLUG=$(npx tsx scripts/select-post.ts x 2>/dev/null || true)
          fi
          echo "BSKY_SLUG=${BSKY_SLUG}" >> $GITHUB_ENV
          echo "X_SLUG=${X_SLUG}" >> $GITHUB_ENV
          echo "post_slug=${BSKY_SLUG}" >> $GITHUB_OUTPUT
          echo "Today's picks — bsky: ${BSKY_SLUG:-none}, x: ${X_SLUG:-none}"
          # Feature today's pick on the home page only when this run will actually
          # publish it (schedule always posts; dispatch/call only without dry-run
          # and without skip_post). Otherwise the home falls back to the most
          # recent entry in posted.json.
          WILL_POST="${{ github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.dry_run != true && inputs.skip_post != true) }}"
          if [ "$WILL_POST" = "true" ]; then
            echo "FEATURED_SLUG=${BSKY_SLUG}" >> $GITHUB_ENV
          fi

      - name: Build Astro site
        run: npm run build

      - name: Select OG slugs
        run: |
          # All previously-posted slugs: their detail pages link og/<slug>.png directly
          POSTED_SLUGS=$(node -e "
            const fs = require('fs');
            const p = 'data/posted.json';
            if (!fs.existsSync(p)) { process.stdout.write(''); process.exit(0); }
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            process.stdout.write(d.map(e => e.slug).join(','));
          ")
          # Combine today's picks with the backlog and deduplicate
          ALL="${POSTED_SLUGS}${BSKY_SLUG:+,}${BSKY_SLUG}${X_SLUG:+,}${X_SLUG}"
          ONLY_SLUGS=$(echo "$ALL" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd ',')
          echo "ONLY_SLUGS=${ONLY_SLUGS}" >> $GITHUB_ENV
          COUNT=$(echo "$ONLY_SLUGS" | tr ',' '\n' | grep -c '.' || echo 0)
          echo "Screenshotting ${COUNT} OG cards"

      - name: Generate OG screenshots
        run: npm run og

      # Hand the PNGs to the post jobs directly — fetching them back through the
      # Pages CDN is unreliable right after a deploy (propagation lag, and Fastly
      # caches the interim 404s, poisoning every retry).
      - name: Upload OG images artifact
        uses: actions/upload-artifact@v7
        with:
          name: og-images
          path: dist/og/
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ─────────────────────────────────────────────────────────────
  # Job 3: Post daily highlight to Bluesky
  # Only on nightly schedule — not on push or manual trigger
  # Requires secrets: BSKY_IDENTIFIER, BSKY_APP_PASSWORD
  # ─────────────────────────────────────────────────────────────
  post:
    name: Post daily highlight
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: BSKY_IDENTIFIER
    # !cancelled() breaks GHA's transitive skip propagation: with skip_collect,
    # collect's skip would otherwise cascade past a successful deploy and skip
    # this job too.
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
      inputs.skip_post != true
    outputs:
      bsky_url: ${{ steps.post_bluesky.outputs.bsky_url }}
      bsky_post_text_b64: ${{ steps.post_bluesky.outputs.bsky_post_text_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # When triggered by a submission, compute the slug to feature that project.
      - name: Compute submission slug
        id: submission_slug
        if: inputs.submission_repo != ''
        env:
          SUBMISSION_REPO: ${{ inputs.submission_repo }}
        run: |
          SLUG=$(echo "$SUBMISSION_REPO" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|; s|[^a-z0-9-]|-|g')
          echo "value=$SLUG" >> $GITHUB_OUTPUT

      - name: Download OG images
        uses: actions/download-artifact@v8
        with:
          name: og-images
          path: og-images

      - name: Post to Bluesky
        id: post_bluesky
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/post.ts 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          BSKY_URL=$(echo "$OUTPUT" | grep "^BSKY_POST_URL=" | cut -d= -f2-)
          BSKY_TEXT=$(echo "$OUTPUT" | grep "^BSKY_POST_TEXT_B64=" | cut -d= -f2-)
          echo "bsky_url=${BSKY_URL}" >> $GITHUB_OUTPUT
          echo "bsky_post_text_b64=${BSKY_TEXT}" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        env:
          BSKY_IDENTIFIER:   ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BASE_URL:          https://capuz.github.io/silentstars
          DRY_RUN:           ${{ inputs.dry_run }}
          OG_DIR:            og-images
          PROJECT_SLUG:      ${{ steps.submission_slug.outputs.value || needs.deploy.outputs.post_slug }}

      - name: Commit posted.json
        if: inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "chore: record bsky post [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done

  # ─────────────────────────────────────────────────────────────
  # Job 4: Post daily highlight to X.com
  # Runs after the Bluesky post job (sequenced only to avoid both jobs
  # appending to data/posted.json at once — a real merge conflict, not
  # a fast-forward race that `pull --rebase` retries can resolve).
  # Still independent of its outcome: runs even if post failed/skipped,
  # since X posting is optional and relies on X API credits.
  # Requires secrets: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
  # ─────────────────────────────────────────────────────────────
  post-x:
    name: Post to X.com
    runs-on: ubuntu-latest
    needs: [deploy, post]
    # Tolerates a failed post job (X is independent of Bluesky's outcome) but
    # requires a successful deploy — posting a project whose page never went
    # live puts a dead link on X.
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
      inputs.skip_post_x != true
    continue-on-error: true
    outputs:
      x_post_url: ${{ steps.post_x.outputs.x_post_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute submission slug
        id: submission_slug_x
        if: inputs.submission_repo != ''
        env:
          SUBMISSION_REPO: ${{ inputs.submission_repo }}
        run: |
          SLUG=$(echo "$SUBMISSION_REPO" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|; s|[^a-z0-9-]|-|g')
          echo "value=$SLUG" >> $GITHUB_OUTPUT

      - name: Download OG images
        uses: actions/download-artifact@v8
        with:
          name: og-images
          path: og-images

      - name: Post to X.com
        id: post_x
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/post-x.ts 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          X_URL=$(echo "$OUTPUT" | grep "^X_POST_URL=" | cut -d= -f2-)
          echo "x_post_url=${X_URL}" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BASE_URL:              https://capuz.github.io/silentstars
          DRY_RUN:               ${{ inputs.dry_run }}
          OG_DIR:                og-images
          PROJECT_SLUG:          ${{ steps.submission_slug_x.outputs.value || needs.deploy.outputs.post_slug }}

      - name: Commit posted.json
        if: inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "chore: record x post [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
