name: Nightly collect + deploy

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every night
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Saltar collect (no actualiza datos de GitHub)"
        type: boolean
        default: false
      skip_post:
        description: "Saltar post a Bluesky"
        type: boolean
        default: false
      skip_post_x:
        description: "Saltar post a X.com"
        type: boolean
        default: true
      dry_run:
        description: "Dry run — log post without sending to Bluesky or X.com"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: query GitHub API, update data/ and content/projects/
  # Only runs on schedule or manual trigger (not on push)
  # ─────────────────────────────────────────────────────────────
  collect:
    name: Collect data
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.skip_collect != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Discover new candidates
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect and update data
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/discovered.json src/content/projects/
          git diff --cached --quiet || git commit -m "chore: nightly data collect [skip ci]"
          git push

  # ─────────────────────────────────────────────────────────────
  # Job 2: Astro build + deploy to GitHub Pages
  # Runs after collect (when scheduled) OR directly on push to main
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: [collect]
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # always build the latest commit (after collect may have pushed)

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Astro site
        run: npm run build

      - name: Generate OG screenshots
        run: npm run og

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────────
  # Job 3: Post daily highlight to Bluesky
  # Only on nightly schedule — not on push or manual trigger
  # Requires secrets: BSKY_IDENTIFIER, BSKY_APP_PASSWORD
  # ─────────────────────────────────────────────────────────────
  post:
    name: Post daily highlight
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: BSKY_IDENTIFIER
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.skip_post != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post to Bluesky
        run: npx tsx scripts/post.ts
        env:
          BSKY_IDENTIFIER:   ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BASE_URL:          https://capuz.github.io/silentstars
          DRY_RUN:           ${{ inputs.dry_run }}

  # ─────────────────────────────────────────────────────────────
  # Job 4: Post daily highlight to X.com
  # Runs in parallel with Bluesky post after deploy
  # Requires secrets: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
  # ─────────────────────────────────────────────────────────────
  post-x:
    name: Post to X.com
    runs-on: ubuntu-latest
    needs: [deploy]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.skip_post_x != 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post to X.com
        run: npx tsx scripts/post-x.ts
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BASE_URL:              https://capuz.github.io/silentstars
          DRY_RUN:               ${{ inputs.dry_run }}
