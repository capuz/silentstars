name: Nightly collect + deploy

on:
  schedule:
    # 03:37 UTC every night. Off the top of the hour on purpose: GitHub's
    # hosted-runner pool is most congested at :00, which delays scheduled
    # runs for hours and can starve jobs entirely ("job was not acquired
    # by Runner", run 28999134437).
    - cron: '37 3 * * *'
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip_collect:
        type: boolean
        default: false
      skip_post:
        type: boolean
        default: false
      submission_repo:
        type: string
        default: ''
      submission_project_name:
        type: string
        default: ''
    outputs:
      bsky_url:
        description: "Bluesky post URL"
        value: ${{ jobs.post.outputs.bsky_url }}
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Saltar collect (no actualiza datos de GitHub)"
        type: boolean
        default: false
      skip_post:
        description: "Saltar post a Bluesky"
        type: boolean
        default: false
      dry_run:
        description: "Dry run — log post without sending to Bluesky"
        type: boolean
        default: true
      # Submission flow — set by process-submission.yml when a new project is accepted
      submission_repo:
        description: "owner/repo that triggered this run (submission flow)"
        type: string
        default: ''
      submission_issue:
        description: "Issue number of the original submission"
        type: string
        default: ''
      submission_email:
        description: "Submitter email to notify after deploy+post"
        type: string
        default: ''
      submission_project_name:
        description: "Project display name for the notification email"
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: query GitHub API, update data/ and content/projects/
  # Only runs on schedule or manual trigger (not on push)
  # ─────────────────────────────────────────────────────────────
  collect:
    name: Collect data
    runs-on: ubuntu-latest
    # Boolean inputs must be compared as booleans: `!= 'true'` never matches a
    # typed boolean input (GHA coerces true→1 vs 'true'→NaN), silently disabling
    # the skip flags on manual dispatches.
    # inputs.submission_repo is only set when process-submission.yml calls this
    # workflow via workflow_call — github.event_name can't detect that case: it
    # retains the ORIGINAL event that triggered the calling workflow ('issues'
    # here), never becomes 'workflow_call' (github/actions/runner#3146).
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.submission_repo != '') && inputs.skip_collect != true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ref: main — on the submission flow this workflow is reached via
          # workflow_call, so github.sha is the caller's commit, which predates
          # the "Commit promoted.json" push that process-submission.yml's
          # validate job just made. Without ref, collect.ts would read a stale
          # promoted.json, never query the submitted repo, and post.ts would
          # then throw "Project not found" (issues #9-#12). deploy/post/redeploy
          # already pin ref: main for the same class of race (issue #8).
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Discover new candidates
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect and update data
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # promoted.json must be staged too: collect.ts prunes expired entries
          # from it, and any file it touches but we don't stage blocks the
          # pull --rebase below ("You have unstaged changes", 3 nights of
          # failures starting when KoalaSync's 30-day entry expired 2026-07-26).
          git add data/latest.json data/discovered.json data/promoted.json src/content/projects/ data/posted.json
          git diff --cached --quiet || git commit -m "chore: nightly data collect [skip ci]"
          # pull --rebase before pushing: reruns are pinned to the original
          # commit, so main may have moved and a bare push is rejected as
          # non-fast-forward (attempt 2 of run 28999134437). Same loop as the
          # post/notify jobs — but fail loudly if all attempts lose the race,
          # or the night's collected data would silently evaporate.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push collected data after 5 attempts" >&2
          exit 1

  # ─────────────────────────────────────────────────────────────
  # Job 2: Astro build + deploy to GitHub Pages
  # Runs after collect (when scheduled) OR directly on push to main
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: [collect]
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      post_slug: ${{ steps.picks.outputs.post_slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main   # always build the latest commit (after collect may have pushed)

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # Single source of truth for today's pick: the post job consumes post_slug
      # instead of re-running the selection and hoping it agrees. Runs before the
      # build so the home page can feature today's pick (FEATURED_SLUG).
      - name: Select today's picks
        id: picks
        run: |
          # 'any' excludes projects already posted on any platform, including
          # the historical X posts still recorded in posted.json.
          if [ -n "${{ inputs.submission_repo }}" ]; then
            POST_SLUG=$(echo "${{ inputs.submission_repo }}" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|; s|[^a-z0-9-]|-|g')
          else
            POST_SLUG=$(npx tsx scripts/select-post.ts any 2>/dev/null || true)
          fi
          echo "POST_SLUG=${POST_SLUG}" >> $GITHUB_ENV
          echo "post_slug=${POST_SLUG}" >> $GITHUB_OUTPUT
          echo "Today's pick — ${POST_SLUG:-none}"
          # Feature today's pick on the home page only when this run will actually
          # publish it (schedule always posts; dispatch/call only without dry-run
          # and without skip_post). Otherwise the home falls back to the most
          # recent entry in posted.json.
          WILL_POST="${{ github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.dry_run != true && inputs.skip_post != true) }}"
          if [ "$WILL_POST" = "true" ]; then
            echo "FEATURED_SLUG=${POST_SLUG}" >> $GITHUB_ENV
          fi

      - name: Build Astro site
        run: npm run build

      - name: Select OG slugs
        run: |
          # All previously-posted slugs: their detail pages link og/<slug>.png directly
          POSTED_SLUGS=$(node -e "
            const fs = require('fs');
            const p = 'data/posted.json';
            if (!fs.existsSync(p)) { process.stdout.write(''); process.exit(0); }
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            process.stdout.write(d.map(e => e.slug).join(','));
          ")
          # Combine today's pick with the backlog and deduplicate
          ALL="${POSTED_SLUGS}${POST_SLUG:+,}${POST_SLUG}"
          ONLY_SLUGS=$(echo "$ALL" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd ',')
          echo "ONLY_SLUGS=${ONLY_SLUGS}" >> $GITHUB_ENV
          COUNT=$(echo "$ONLY_SLUGS" | tr ',' '\n' | grep -c '.' || echo 0)
          echo "Screenshotting ${COUNT} OG cards"

      - name: Generate OG screenshots
        run: npm run og

      # Hand the PNGs to the post jobs directly — fetching them back through the
      # Pages CDN is unreliable right after a deploy (propagation lag, and Fastly
      # caches the interim 404s, poisoning every retry).
      - name: Upload OG images artifact
        uses: actions/upload-artifact@v7
        with:
          name: og-images
          path: dist/og/
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ─────────────────────────────────────────────────────────────
  # Job 3: Post daily highlight to Bluesky
  # Only on nightly schedule — not on push or manual trigger
  # Requires secrets: BSKY_IDENTIFIER, BSKY_APP_PASSWORD
  # ─────────────────────────────────────────────────────────────
  post:
    name: Post daily highlight
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: BSKY_IDENTIFIER
    # !cancelled() breaks GHA's transitive skip propagation: with skip_collect,
    # collect's skip would otherwise cascade past a successful deploy and skip
    # this job too.
    # github.event_name == 'workflow_call' never matches here — see the collect
    # job's comment above — so submission-triggered runs are detected via
    # inputs.submission_repo instead.
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.submission_repo != '') &&
      inputs.skip_post != true
    outputs:
      bsky_url: ${{ steps.post_bluesky.outputs.bsky_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # When triggered by a submission, compute the slug to feature that project.
      - name: Compute submission slug
        id: submission_slug
        if: inputs.submission_repo != ''
        env:
          SUBMISSION_REPO: ${{ inputs.submission_repo }}
        run: |
          SLUG=$(echo "$SUBMISSION_REPO" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|; s|[^a-z0-9-]|-|g')
          echo "value=$SLUG" >> $GITHUB_OUTPUT

      - name: Download OG images
        uses: actions/download-artifact@v8
        with:
          name: og-images
          path: og-images

      - name: Post to Bluesky
        id: post_bluesky
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/post.ts 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          BSKY_URL=$(echo "$OUTPUT" | grep "^BSKY_POST_URL=" | cut -d= -f2-)
          echo "bsky_url=${BSKY_URL}" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        env:
          BSKY_IDENTIFIER:   ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BASE_URL:          https://capuz.github.io/silentstars
          DRY_RUN:           ${{ inputs.dry_run }}
          OG_DIR:            og-images
          PROJECT_SLUG:      ${{ steps.submission_slug.outputs.value || needs.deploy.outputs.post_slug }}

      - name: Commit posted.json
        if: inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "chore: record bsky post [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done

  # ─────────────────────────────────────────────────────────────
  # Job 4: Rebuild + redeploy so tonight's project page shows the
  # post URL. posted.json is written by the post job AFTER the
  # first deploy — without this pass, the Bluesky pill on the
  # project page always lags one night behind. Reuses the OG artifact
  # from deploy instead of regenerating (no Playwright).
  # ─────────────────────────────────────────────────────────────
  redeploy:
    name: Redeploy with post URLs
    runs-on: ubuntu-latest
    needs: [deploy, post]
    # Runs only when the post actually published (its record commit
    # is what the rebuild picks up).
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      inputs.dry_run != true &&
      needs.post.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main   # includes the record bsky post commit

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          FEATURED_SLUG: ${{ needs.deploy.outputs.post_slug }}

      - name: Restore OG images from deploy
        uses: actions/download-artifact@v8
        with:
          name: og-images
          path: dist/og

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Distinct artifact name: deploy already uploaded "github-pages" in this
      # same run, and deploy-pages@v5 refuses when two artifacts share a name
      # ("Multiple artifacts named github-pages", run 29048959396).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          name: github-pages-redeploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-redeploy

  # ─────────────────────────────────────────────────────────────
  # Job 5: Notify tonight's featured project owner (organic picks only).
  # Skipped for submission-triggered runs — that submitter already gets
  # their own acceptance email from process-submission.yml, and emailing
  # the repo owner too (often the same person) would be a redundant
  # second email with different wording. Silent no-op if the owner has
  # no public GitHub email (see scripts/notify-owners.ts).
  # ─────────────────────────────────────────────────────────────
  notify-owner:
    name: Notify featured project owner
    runs-on: ubuntu-latest
    needs: [deploy, post]
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      inputs.dry_run != true && inputs.submission_repo == '' &&
      needs.deploy.outputs.post_slug != '' &&
      needs.post.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Notify owner
        env:
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
          NOTIFY_BCC:        fcapuz@gmail.com
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          BASE_URL:          https://capuz.github.io/silentstars
          SLUGS:             ${{ needs.deploy.outputs.post_slug }}
        run: npx tsx scripts/notify-owners.ts

      - name: Commit posted.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "chore: record owner outreach email [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
