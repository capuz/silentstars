name: Standby recheck

# Daily pass over data/standby.json: drops submissions whose 90-day standby
# expired and re-dispatches process-submission.yml for those that gained a
# star/fork from someone other than the owner (see scripts/standby.ts).

on:
  schedule:
    # Off the top of the hour: hosted runners are most congested at :00.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  recheck:
    name: Recheck standby submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Recheck
        id: recheck
        run: npx tsx scripts/standby-recheck.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER:   ${{ github.repository_owner }}
          REPO_NAME:    ${{ github.event.repository.name }}

      - name: Commit expired removals
        if: steps.recheck.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standby.json
          git commit -m "chore(standby): drop expired entries [skip ci]"
          # Same rebase-retry loop as collect.yml / process-submission.yml.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push standby.json after 5 attempts" >&2
          exit 1
