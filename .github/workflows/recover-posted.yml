name: Recover posted pages

# One-time manual workflow: scans Bluesky AND X for SilentStars posts,
# rebuilds posted.json, re-fetches those repos from GitHub, and deploys.
# X credentials are optional — if omitted, only Bluesky is scanned.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — scan and log without writing files or deploying"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  recover:
    name: Scan and recover pages
    runs-on: ubuntu-latest
    environment: BSKY_IDENTIFIER
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan Bluesky and X — update posted.json
        run: npx tsx scripts/recover-posted.ts
        env:
          BSKY_IDENTIFIER:       ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD:     ${{ secrets.BSKY_APP_PASSWORD }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BASE_URL:              https://capuz.github.io/silentstars
          DRY_RUN:               ${{ inputs.dry_run }}

      - name: Re-collect posted repos from GitHub
        if: inputs.dry_run != 'true'
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        if: inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json data/latest.json src/content/projects/
          git diff --cached --quiet || git commit -m "chore: recover posted pages [skip ci]"
          git push

      - name: Trigger deploy
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run collect.yml \
            --repo ${{ github.repository }} \
            -f skip_collect=true \
            -f skip_post=true \
            -f skip_post_x=true \
            -f dry_run=false
