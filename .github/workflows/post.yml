name: Post to Bluesky

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Slug or repo to post (e.g. opn-build--openalive) — leave blank for daily pick"
        type: string
        default: ''
      dry_run:
        description: "Dry run — log post without sending to Bluesky"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    name: Post daily highlight
    runs-on: ubuntu-latest
    environment: BSKY_IDENTIFIER
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npx tsx scripts/post.ts
        env:
          BSKY_IDENTIFIER:   ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BASE_URL:          https://capuz.github.io/silentstars
          DRY_RUN:           ${{ inputs.dry_run }}
          PROJECT_SLUG:      ${{ inputs.project }}

      - name: Commit posted.json
        if: inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "chore: record bsky post [skip ci]"
          git pull --rebase origin main
          git push
