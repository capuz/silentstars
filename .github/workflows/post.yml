name: Post to Bluesky

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Slug or repo to post (e.g. opn-build--openalive) — leave blank for daily pick"
        type: string
        default: ''
      dry_run:
        description: "Dry run — log post without sending to Bluesky"
        type: boolean
        default: true

jobs:
  post:
    name: Post daily highlight
    runs-on: ubuntu-latest
    environment: BSKY_IDENTIFIER
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - run: npx tsx scripts/post.ts
        env:
          BSKY_IDENTIFIER:   ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BASE_URL:          https://capuz.github.io/silentstars
          DRY_RUN:           ${{ inputs.dry_run }}
          PROJECT_SLUG:      ${{ inputs.project }}
