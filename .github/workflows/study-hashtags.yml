name: Study Bluesky Hashtags

on:
  schedule:
    - cron: '0 4 * * 1'   # lunes 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    name: Hashtag study
    runs-on: ubuntu-latest
    environment: BSKY_IDENTIFIER
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npx tsx scripts/study-hashtags.ts
        env:
          BSKY_IDENTIFIER:   ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}

      - name: Commit scores
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hashtag-scores.json
          git diff --cached --quiet || git commit -m "chore: update hashtag scores [skip ci]"
          git push
