name: OG Images Preview

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build-og:
    name: Generate OG images
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous runs and artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'og-preview.yml',
              per_page: 50,
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              for (const a of artifacts.data.artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
              }
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Build Astro site
        run: npm run build

      - name: Generate OG screenshots
        run: npm run og

      - uses: actions/upload-artifact@v4
        with:
          name: og-images
          path: dist/og/
          retention-days: 3
