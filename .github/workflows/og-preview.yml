name: OG Images Preview

on:
  workflow_dispatch:

jobs:
  build-og:
    name: Generate OG images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: og-images
          path: dist/og/
          retention-days: 3
